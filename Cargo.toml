[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mahmoudfarouq/sro-toolbox"
authors = ["Mahmoud Farouk <mahmoud.farouk987@gmail.com>"]

# Versions live here so every crate agrees. Members refer to these with
# `dep.workspace = true`.
[workspace.dependencies]
sro-toolbox-domain = { path = "crates/domain", version = "0.1.0" }
sro-toolbox-application = { path = "crates/application", version = "0.1.0" }
sro-toolbox-infrastructure = { path = "crates/infrastructure", version = "0.1.0" }

async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# dev
assert_cmd = "2.2.2"
predicates = "3.1.4"
rstest = "0.26.1"

# Applied by every member via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Nudges away from panicking paths in library code.
panic_in_result_fn = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
